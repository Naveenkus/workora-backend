spring.application.name=workora-backend
server.port=8080

# DATABASE - values from .env
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/workora_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:@Postgresql123#}
spring.datasource.driver-class-name=org.postgresql.Driver


# JDBC
spring.jdbc.template.query-timeout=30

# FLYWAY - SQL migration tool
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Logging
logging.level.org.springframework.jdbc=DEBUG

# Devtools
spring.devtools.restart.enabled=true
